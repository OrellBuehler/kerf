[workspace]
resolver = "2"
members = ["crates/kerf-core", "crates/kerf-app"]

[workspace.package]
version = "0.22.0"
edition = "2021"
rust-version = "1.95"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["Orell Bühler <me@orellbuehler.ch>"]
repository = "https://github.com/orellbuehler/kerf"
homepage = "https://github.com/orellbuehler/kerf"

# Checked by `cargo clippy` (CI runs it with `-D warnings`, prek on push).
# Beyond clippy's defaults: no debugging leftovers or unfinished stubs, no
# stray console output (use `tracing`), and every `unsafe` block justified.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "warn"
large_futures = "warn"
cloned_instead_of_copied = "warn"
implicit_clone = "warn"
manual_let_else = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"

[workspace.dependencies]
# Shared crates — ffmpeg is opt-in; consumers forward it via their own feature
kerf-core = { path = "crates/kerf-core", default-features = false }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

# Errors
anyhow = "1.0.102"
thiserror = "2.0.18"

# Async
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "io-std", "sync"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"

# Domain helpers
uuid = { version = "1.23", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Persistence — bundled SQLite (no system libsqlite needed)
rusqlite = { version = "0.40", features = ["bundled"] }

# Fonts — pure-Rust system font directory scan + parse, no dev-lib linking
fontdb = "0.24"

# Media — system FFmpeg (libav*) via pkg-config; compatible with FFmpeg >= 3.4
ffmpeg-next = "9.0"

# MCP — official Rust SDK (streamable-HTTP server transport, hosted by kerf-app)
rmcp = { version = "3.1", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2"

# HTTP server for the embedded MCP endpoint (matches rmcp's tower/axum 0.8)
axum = "0.8"

# Desktop shell — Tauri v2
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# A second launch hands its argv to the running app instead of starting another.
tauri-plugin-single-instance = "2.5"
# Auto-update: checks the GitHub release feed and installs a signed bundle;
# `process` supplies the relaunch after the install.
tauri-plugin-updater = "2.10"
tauri-plugin-process = "2.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = "debuginfo"
