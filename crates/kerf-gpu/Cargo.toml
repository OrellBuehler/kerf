[package]
name = "kerf-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Kerf wgpu compositor: renders a kerf-core RenderPlan on the GPU, with an FFmpeg parity harness"
publish = false

[lints]
workspace = true

[features]
default = ["ffmpeg"]
# Forward in-process libav probing to kerf-core, like every other crate. The
# compositor itself never links FFmpeg: frames come from the `ffmpeg` binary.
ffmpeg = ["kerf-core/ffmpeg"]
# The test files that hold nothing but `#[ignore]`d cases and that no CI job names: the independent
# checkers' sweeps, the benches, the probes that want a process each. Without the feature cargo does
# not build them (they are a hundred thousand lines and a binary each, and `cargo test --workspace`
# would link every one to run nothing); with it they are ordinary targets:
# `cargo test -p kerf-gpu --no-default-features --features local-suites --test checker_z -- --ignored`.
# Asking for one without it is cargo's own error, never an empty run. The list is at the end of this
# file; clippy and the MSRV check pass the feature, so every file is still compiled and linted.
local-suites = []

[dependencies]
kerf-core = { workspace = true }
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
kerf-core = { workspace = true, features = ["test-support"] }

# Built only with `--features local-suites` (see the feature). A file belongs here when every test in
# it is `#[ignore]`d and CI's parity job does not run it; a new file that is not listed is built
# always, which is the safe default.
[[test]]
name = "bench"
path = "tests/bench.rs"
required-features = ["local-suites"]

