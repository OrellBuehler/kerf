[package]
name = "kerf-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Kerf domain model, .kerf project persistence, and FFmpeg media engine"

[lints]
workspace = true

[features]
default = ["ffmpeg"]
# In-process libav probing via ffmpeg-next. Requires the system FFmpeg dev
# libraries (see README). Disable to build the domain model + MCP read tools
# with only the FFmpeg *binaries* (analysis / frames / waveforms / export all
# run by driving the `ffmpeg` / `ffprobe` CLI, which needs no dev libraries).
ffmpeg = ["dep:ffmpeg-next"]
# Experimental in-process libav export pipeline (otherwise export drives the
# `ffmpeg` binary). Implies `ffmpeg`; needs the FFmpeg dev libraries.
libav-render = ["ffmpeg"]
# In-process speech-to-text via whisper-rs. Needs the whisper.cpp build
# toolchain (cmake + a C++ compiler); the ggml model itself is downloaded at
# runtime, so no manual setup is required either way. Without this feature
# transcription still works when the `ffmpeg` binary has the (FFmpeg 8.0)
# `whisper` filter — see `engine::whisper`.
whisper = ["dep:whisper-rs"]
# `hostile`, the seeded mutation the robustness tests share; never in a release build.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
rusqlite.workspace = true
tracing.workspace = true
dirs = "7"
fontdb.workspace = true
# Speech model downloads (see engine::whisper). Blocking + rustls, so it needs
# no async runtime and no system OpenSSL.
ureq = "3.4"
# Voiceover (see engine::tts): Kokoro runs on ONNX Runtime, loaded at runtime
# from a library downloaded on first use (`load-dynamic`), so nothing native is
# linked at build time. misaki-rs without its GPL espeak-ng fallback.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "load-dynamic"] }
misaki-rs = { version = "0.6", default-features = false }
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
# STFT for the music analysis (onset flux, chroma; see engine::music).
realfft = "3.5"
# Composing music (see engine::compose): a pure-Rust SoundFont synthesizer, so a score renders
# in-process with nothing native to ship. Pinned: 1.3.7 is too new to take yet.
rustysynth = "=1.3.7"
# Animated SVG overlays (see svg): roxmltree reads the source, resvg draws each frame. Text and
# system fonts, and the raster codecs (PNG, JPEG, GIF, WebP) an `<image>` with a `data:` URL needs
# (a logo in a lower third); nothing is ever read from a path or a URL.
roxmltree = "0.21"
svgtypes = "0.16"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
tiny-skia = "0.12"
# The pictures of the cache are written with `png` directly, at a quick level (svg::raster::encode_frame_png);
# it is the encoder `tiny-skia` already links.
png = "0.18"
# The size of an embedded image is read from its header before anything decodes it (svg::images),
# and a `data:` URL is decoded the way usvg decodes it; both crates are resvg's own.
imagesize = "0.15"
data-url = "0.3"
# The text engine (see text): the shaper, font reader, bidi and CSS cascade usvg already links, at
# its versions, plus UAX #14 line breaking. Template text is set as glyph outlines with them.
harfrust = "0.12"
skrifa = { version = "0.44", default-features = false, features = ["std"] }
unicode-bidi = "0.3"
unicode-script = "0.5"
unicode-linebreak = "0.1.5"
# Diacritic folding for transcript search (transcript::search); misaki-rs already links it.
unicode-normalization = "0.1.25"
simplecss = "0.2"
ffmpeg-next = { workspace = true, optional = true }
whisper-rs = { version = "0.16.0", optional = true }

[dev-dependencies]
# Itself with `test-support`, so the integration tests under `tests/` see `hostile`.
kerf-core = { path = ".", default-features = false, features = ["test-support"] }

# Scheduling priority for background ffmpeg runs (see engine::cpu). Unix only —
# Windows sets its priority class through a process creation flag instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
