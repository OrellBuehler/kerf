[package]
name = "kerf-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Kerf — Tauri v2 desktop shell bridging the SvelteKit frontend to kerf-core"
publish = false

[lib]
name = "kerf_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kerf-app"
path = "src/main.rs"

[features]
default = ["ffmpeg"]
# Forward in-process FFmpeg support to kerf-core (probe / export).
ffmpeg = ["kerf-core/ffmpeg"]
# Forward in-process speech-to-text (whisper.cpp) to kerf-core. Off by default:
# it needs cmake, a C++ compiler and libclang at build time, whereas the
# always-compiled fallback (FFmpeg's own `whisper` filter) needs nothing —
# see `kerf_core::engine::whisper`. Turn it on for release builds to guarantee
# transcription regardless of how the user's ffmpeg was configured.
whisper = ["kerf-core/whisper"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri = { workspace = true, features = [] }
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-process.workspace = true
kerf-core = { workspace = true }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
base64 = "0.23.1"

# Embedded MCP server (streamable HTTP) — the app *is* the MCP server.
rmcp.workspace = true
schemars.workspace = true
axum.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["net"] }
