version: 2
updates:
  # The workflows pin actions by commit SHA, which nothing updates on its own —
  # Dependabot rewrites the SHA and the trailing `# vN` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # Tauri ships its crates in lockstep; splitting them across PRs just
      # produces ones that don't build.
      tauri:
        patterns: ["tauri", "tauri-*"]
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      svelte:
        patterns: ["svelte", "svelte-*", "@sveltejs/*"]
      tauri-js:
        patterns: ["@tauri-apps/*"]
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]
