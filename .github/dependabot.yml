version: 2
updates:
  # The workflows pin actions by commit SHA, which nothing updates on its own —
  # Dependabot rewrites the SHA and the trailing `# vN` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Don't take a version the day it is published — a compromised release is
    # usually yanked within days, and nothing here needs same-day upgrades.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Don't take a version the day it is published — a compromised release is
    # usually yanked within days, and nothing here needs same-day upgrades.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # Pinned to one release candidate (`=2.0.0-rc.N` in kerf-core): each one changes the API the
      # voiceover and the stem separation are written against, and the ONNX Runtime the app
      # downloads is matched to it. A grouped bump that carries the next one does not compile, and
      # takes the rest of its group down with it. Moved by hand, with the runtime.
      - dependency-name: "ort"
      - dependency-name: "ort-sys"
    groups:
      # Tauri ships its crates in lockstep; splitting them across PRs just
      # produces ones that don't build.
      tauri:
        patterns: ["tauri", "tauri-*"]
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: bun
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    # Don't take a version the day it is published — a compromised release is
    # usually yanked within days, and nothing here needs same-day upgrades.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      svelte:
        patterns: ["svelte", "svelte-*", "@sveltejs/*"]
      tauri-js:
        patterns: ["@tauri-apps/*"]
      patch-and-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The hosted image's base images (deploy/Dockerfile).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
    groups:
      images:
        patterns: ["*"]

  # The Caddy image in deploy/compose.yaml.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps"
