name: Release

# Builds and uploads binaries when a GitHub Release is published.
on:
  release:
    types: [published]

# Default to nothing. Only the jobs that attach assets to the release ask for
# `contents: write` — this workflow also holds the updater's minisign private
# key, so its blast radius is worth keeping small.
permissions: {}

# A re-run while an earlier run is still uploading would race on the same
# assets (and on latest.json). Queue it instead, and never cancel a release
# half-way through its uploads.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # `releases/latest` moves to a release the instant it is published, but its
  # `latest.json` is only attached ~20 minutes later, once the slowest bundle has
  # built — so `releases/latest/download/latest.json` 404s for that whole window
  # and every running install's update check fails with "Could not fetch a valid
  # release JSON from the remote". Marking the release a prerelease parks
  # `releases/latest` on the *previous* version, whose manifest is intact, so a
  # check during the build reports "up to date" instead of erroring;
  # `updater-manifest` promotes it back once the feed asset actually exists.
  #
  # Deliberately no `needs:` — every second between the publish event and this
  # step is a second of the gap it closes.
  #
  # It gates on the *event payload*, which our own edit below cannot change, so a
  # release cut as a real prerelease is left alone: it is skipped here, skipped in
  # `updater-manifest`, and never becomes `releases/latest`.
  hold-release:
    name: hold releases/latest
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Park releases/latest until latest.json exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --prerelease

  # Fail before five platform builds burn if the tag and the versions baked into
  # the artifacts disagree. `latest.json` takes its `version` from the tag while
  # the installed app compares that against `tauri.conf.json`'s version — if the
  # two diverge, every user is offered an update that installs the version they
  # already have, forever.
  version-check:
    name: version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Tag must match Cargo.toml, package.json and tauri.conf.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          pkg_v=$(python3 -c 'import json;print(json.load(open("frontend/package.json"))["version"])')
          tauri_v=$(python3 -c 'import json;print(json.load(open("crates/kerf-app/tauri.conf.json"))["version"])')
          echo "tag=$want cargo=$cargo_v package.json=$pkg_v tauri.conf.json=$tauri_v"
          for got in "$cargo_v" "$pkg_v" "$tauri_v"; do
            [ "$got" = "$want" ] || { echo "::error::version mismatch: tag '$want' vs '$got'"; exit 1; }
          done

  # This workflow runs no tests of its own, so what it ships is only as good as
  # the CI run on the tagged commit. A release is usually published straight
  # after its PR merges, while CI on main is still running, so wait for it
  # rather than read a missing run as a failure.
  ci-green:
    name: CI passed on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
    steps:
      - name: Wait for CI on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 110); do
            runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | {status, conclusion, url: .html_url}]')
            if echo "$runs" | jq -e 'any(.[]; .conclusion == "success")' >/dev/null; then
              echo "CI passed: $(echo "$runs" | jq -r 'map(select(.conclusion == "success"))[0].url')"
              exit 0
            fi
            pending=$(echo "$runs" | jq 'map(select(.status != "completed")) | length')
            total=$(echo "$runs" | jq 'length')
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "$runs" | jq -r '.[] | "  \(.conclusion)  \(.url)"'
              echo "::error::CI did not pass on $SHA — fix or re-run it, then re-run this release"
              exit 1
            fi
            # No run at all after ~10 minutes: the tag is on a commit CI never
            # saw (e.g. not on main). `gh workflow run ci.yml --ref <tag>` gives it one.
            if [ "$total" -eq 0 ] && [ "$i" -gt 20 ]; then
              echo "::error::no CI run exists for $SHA — dispatch ci.yml on the tag, then re-run this release"
              exit 1
            fi
            echo "waiting for CI ($pending of $total run(s) in progress)"
            sleep 30
          done
          echo "::error::timed out waiting for CI on $SHA"
          exit 1

  # Desktop app installers (.deb/.AppImage/.rpm, .dmg/.app, .msi/.exe) per OS.
  app-bundles:
    name: app (${{ matrix.platform }} / ${{ matrix.arch }})
    needs: [version-check, ci-green]
    permissions:
      contents: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            arch: aarch64
            args: --target aarch64-apple-darwin
            config: '{"build":{"beforeBuildCommand":""}}'
          - platform: macos-latest
            arch: x86_64
            args: --target x86_64-apple-darwin
            config: '{"build":{"beforeBuildCommand":""}}'
          - platform: ubuntu-22.04
            arch: x86_64
            args: ''
            config: '{"build":{"beforeBuildCommand":""}}'
          # Free for public repos. The updater already maps `linux-aarch64`
          # from an AppImage with `aarch64` in its name.
          - platform: ubuntu-22.04-arm
            arch: aarch64
            args: ''
            config: '{"build":{"beforeBuildCommand":""}}'
          # Windows has no system FFmpeg, so bundle ffmpeg/ffprobe as externalBin
          # sidecars (fetched below). Injecting externalBin only here keeps it out
          # of the plain `cargo build` CI runs, which don't ship the binaries.
          # `resources` *replaces* the committed array rather than extending it,
          # so it repeats the whisper.cpp notice every platform ships.
          - platform: windows-latest
            arch: x86_64
            args: ''
            config: '{"build":{"beforeBuildCommand":""},"bundle":{"externalBin":["binaries/ffmpeg","binaries/ffprobe"],"resources":["licenses/whisper.cpp-NOTICE.md","licenses/FFmpeg-NOTICE.md","licenses/FFmpeg-LICENSE.txt"]}}'
            bundleFfmpeg: true
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies (Tauri)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Deliberately uncached, here and for cargo below: a release build is
          # signed and auto-installed by every user, so it is built cold rather
          # than from a cache a lower-privileged run could have written into.
          no-cache: true
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Build the frontend ourselves so the build is deterministic and so we can
      # disable the committed `beforeBuildCommand` (it uses `$(git rev-parse ...)`,
      # which is not valid on the Windows `cmd` runner) via the --config override.
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      # Fetch ffmpeg/ffprobe into crates/kerf-app/binaries/ so Tauri can bundle
      # them as externalBin sidecars (Windows only — see the matrix config above).
      - name: Fetch bundled FFmpeg
        if: matrix.bundleFfmpeg
        run: bun scripts/fetch-ffmpeg.mjs ${{ matrix.arch }}-pc-windows-msvc
      # Release bundles are built with the `whisper` cargo feature (see the args
      # below), which compiles whisper.cpp in-process. Without it a release ships
      # with no speech-to-text at all wherever the local `ffmpeg` lacks the
      # (8.0+) `whisper` filter — which is every Windows install, since the
      # sidecar fetched above is a `--disable-whisper` build.
      - name: Install the whisper.cpp build toolchain
        uses: ./.github/actions/whisper-toolchain
      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (`bundle.createUpdaterArtifacts`) with the
          # project's minisign key; the app only installs an update whose
          # signature verifies against the `pubkey` in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/kerf-app
          tauriScript: bunx @tauri-apps/cli@2
          releaseId: ${{ github.event.release.id }}
          # `latest.json` is assembled once by the `updater-manifest` job below:
          # the per-platform jobs run concurrently and would each overwrite the
          # others' entries in it.
          uploadUpdaterJson: false
          # `--config` (per matrix row) zeroes out beforeBuildCommand (frontend is
          # already built) and, on Windows, adds the FFmpeg externalBin sidecars.
          # Everything after `--` is forwarded to cargo, where --no-default-features
          # disables the FFmpeg dev-library dependency, --features whisper compiles
          # in-process speech-to-text so transcription never depends on how the
          # user's ffmpeg was configured, and --locked builds exactly the
          # dependency versions in the committed Cargo.lock.
          args: "${{ matrix.args }} --config '${{ matrix.config }}' -- --no-default-features --features whisper --locked"

  # A verifiable link from every installer back to the commit and workflow run
  # that built it (`gh attestation verify <file> --repo OrellBuehler/kerf`). The
  # updater itself only trusts the minisign key, which is a repo secret; this is
  # the check a user or packager can run without trusting that secret.
  # `!cancelled()` for the same reason as the manifest: attest what did build.
  attest:
    name: build provenance
    needs: app-bundles
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the release bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir bundles --clobber \
            --pattern '*.dmg' --pattern '*.app.tar.gz' --pattern '*.AppImage' \
            --pattern '*.deb' --pattern '*.rpm' --pattern '*.msi' --pattern '*.exe'
          ls -l bundles
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: bundles/*

  # The update feed the app polls (`plugins.updater.endpoints` in tauri.conf.json
  # points at this release asset). Built after every bundle is uploaded, from the
  # `.sig` files tauri-action attached, so all platforms land in one manifest —
  # letting each build write it would leave whichever finished last.
  #
  # `!cancelled()` rather than plain success: the matrix is `fail-fast: false`, and
  # one platform failing must not leave the release with *no* manifest at all —
  # `releases/latest/download/latest.json` would 404 for everyone, breaking the
  # update check on the platforms that did build. A partial manifest only means the
  # missing platform sees "up to date" until the release is re-run.
  #
  # If this job never gets there the release simply stays the prerelease
  # `hold-release` made it: `releases/latest` keeps pointing at the last version
  # that has a manifest, so a failed release is invisible to the update feed
  # rather than breaking it.
  updater-manifest:
    name: latest.json
    needs: [hold-release, app-bundles]
    if: ${{ !cancelled() && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Assemble and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.sig' --dir sigs --clobber
          gh release view "$TAG" --json body,publishedAt > release.json
          python3 - <<'PY'
          import json, os, pathlib, sys

          tag = os.environ["TAG"]
          repo = os.environ["GH_REPO"]
          meta = json.load(open("release.json"))

          def platform_of(name: str):
              """Map an updater bundle file name to a Tauri `platforms` key."""
              if name.endswith(".app.tar.gz"):
                  return "darwin-aarch64" if "aarch64" in name else "darwin-x86_64"
              if name.endswith(".AppImage"):
                  return "linux-aarch64" if "aarch64" in name else "linux-x86_64"
              if name.endswith("-setup.exe") or name.endswith(".msi"):
                  return "windows-aarch64" if "arm64" in name else "windows-x86_64"
              return None

          platforms = {}
          for sig in sorted(pathlib.Path("sigs").iterdir()):
              bundle = sig.name[:-4]  # strip .sig
              key = platform_of(bundle)
              if not key:
                  continue
              # A release carrying both NSIS and MSI keeps the NSIS installer:
              # it is the one the updater can run unattended.
              if key in platforms and bundle.endswith(".msi"):
                  continue
              platforms[key] = {
                  "signature": sig.read_text().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{bundle.replace(' ', '%20')}",
              }

          if not platforms:
              sys.exit("no signed updater artifacts found — is TAURI_SIGNING_PRIVATE_KEY set?")

          json.dump(
              {
                  "version": tag.lstrip("v"),
                  "notes": meta.get("body") or "",
                  "pub_date": meta.get("publishedAt"),
                  "platforms": platforms,
              },
              open("latest.json", "w"),
              indent=2,
          )
          print(json.dumps(sorted(platforms), indent=2))
          PY
          gh release upload "$TAG" latest.json --clobber
      # Only now does `releases/latest` move to this tag — and it already carries
      # the manifest the app is about to fetch from it, so the feed never 404s.
      - name: Promote to releases/latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$TAG" --prerelease=false --latest
      # Read the feed back the way an installed app does. A partial manifest is
      # still published (better than none), but it must not ship *silently*:
      # a missing platform turns this run red, and re-running the failed bundle
      # job then re-runs this one.
      - name: Verify the published feed
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          url="https://github.com/$GH_REPO/releases/latest/download/latest.json"
          for i in $(seq 1 10); do
            if curl -fsSL "$url" -o feed.json \
              && [ "$(jq -r .version feed.json)" = "${TAG#v}" ]; then
              break
            fi
            echo "feed not serving ${TAG#v} yet, retrying"; sleep 15
          done
          jq -r '"version \(.version)", (.platforms | keys[])' feed.json
          missing=$(jq -r --arg v "${TAG#v}" '
            if .version != $v then "version (\(.version))" else
            ["darwin-aarch64","darwin-x86_64","linux-aarch64","linux-x86_64","windows-x86_64"]
              - (.platforms | keys) | join(", ") end' feed.json)
          if [ -n "$missing" ]; then
            echo "::error::latest.json is missing: $missing"
            exit 1
          fi
