name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here writes to the repo. Overrides whatever the
# repository default is, so a compromised action can't push or open PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Cargo.lock is committed — CI must build exactly what is in it, or a
  # freshly-yanked/updated transitive dep can change CI's answer silently.
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # kerf-app's tauri-build embeds the frontend at compile time, so it must exist.
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Clippy (no ffmpeg dev libs)
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  msrv:
    # No `${{ env.MSRV }}` here: the `env` context is not available in a job
    # `name`, and referencing it makes the whole workflow fail to start.
    name: msrv
    runs-on: ubuntu-22.04
    env:
      # Keep in sync with `rust-version` in the workspace Cargo.toml and the
      # badge in README.md — this job is what makes that claim true.
      MSRV: "1.95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-${{ env.MSRV }}
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Check on the minimum supported Rust version
        run: cargo check --workspace --all-targets --no-default-features --locked

  frontend:
    name: frontend check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Type check (svelte-check)
        working-directory: frontend
        run: bun run check
      # The TS mirrors of the Rust maths (beat grid, diff headline, delivery
      # formats) and the playback frame gate — the pieces that silently diverge
      # from kerf-core if nobody looks.
      - name: Unit tests (bun)
        working-directory: frontend
        run: bun run test
      # A broken production build only shows up at release time otherwise: the
      # `check` above type-checks, it does not bundle.
      - name: Build
        working-directory: frontend
        run: bun run build

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Unit + integration + doc tests. kerf-app is excluded (it needs the Tauri
      # toolchain + a built frontend); it is tested in the `build` job instead.
      # --no-default-features keeps the FFmpeg dev libraries out of CI.
      - name: Run tests
        run: cargo test --workspace --exclude kerf-app --no-default-features --locked

  engine:
    name: engine (real ffmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The `#[ignore]`d tests: they synthesize media with lavfi and run the real
      # binary, so they check that the filter graphs ffmpeg is actually handed
      # *run* — playback streaming, a timeline with a still/crossfade/grade/
      # drawtext on it, and the cover-fit and project-frame export geometry. The
      # pure unit tests above can only assert on argv. `downloads_a_real_model`
      # stays out: it pulls a whisper model over the network.
      - name: Run the ffmpeg-binary tests
        run: |
          cargo test -p kerf-core --no-default-features --locked -- \
            --ignored --skip downloads_a_real_model

  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: build-${{ matrix.platform }}
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      # Compile the whole workspace on every OS without the FFmpeg dev libraries
      # (the CLI engine still drives the ffmpeg/ffprobe binaries). The desktop
      # app embeds the MCP server, so there is no separate binary to build.
      - name: Build workspace
        run: cargo build --workspace --no-default-features --locked
      # kerf-app is excluded from the `test` job because it needs exactly the
      # toolchain + built frontend this job already has. Its tests run here so
      # the adapter/MCP layer isn't a permanent blind spot.
      - name: Test kerf-app
        run: cargo test -p kerf-app --no-default-features --locked

  # Release bundles are built with `--features whisper` (in-process speech-to-text,
  # so transcription doesn't depend on how the user's ffmpeg was configured). Every
  # job above builds `--no-default-features`, so nothing else here compiles
  # whisper-rs — without this job, a break in it, or a runner image that dropped
  # cmake/libclang, would surface for the first time during a release.
  whisper:
    name: whisper feature (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/whisper-toolchain
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: whisper-${{ matrix.platform }}
      # kerf-core is where whisper-rs is actually used; kerf-app only forwards the
      # feature, and checking it would drag in the Tauri toolchain and a built
      # frontend for no extra coverage.
      - name: Check with in-process whisper
        run: cargo check -p kerf-core --no-default-features --features whisper --locked
      # The release builds a second macOS bundle for x86_64 on the arm64 runner —
      # a cross-compile of whisper.cpp, which is the part most likely to break.
      - name: Check the cross-compiled macOS target
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check -p kerf-core --no-default-features --features whisper --locked \
            --target x86_64-apple-darwin
