name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The engine job fetches the pinned FFmpeg, and BtbN prunes its autobuild tags
  # after about two weeks — a quiet fortnight would otherwise let the pin die
  # unnoticed until the next release (it cost 0.21.0 its Windows installer).
  schedule:
    - cron: "23 5 * * 1"
  # Also how `prepare-release.yml` gets CI onto the PR it opens: a push made
  # with GITHUB_TOKEN triggers no workflows, a dispatch does.
  workflow_dispatch:

# Least privilege: nothing here writes to the repo. Overrides whatever the
# repository default is, so a compromised action can't push or open PRs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts are useless on a fresh runner and bloat the cache.
  # (The lockfile is enforced by `--locked` on every cargo invocation.)
  CARGO_INCREMENTAL: 0

jobs:
  # The prek commit stage (`.pre-commit-config.yaml`) — file hygiene, typos,
  # actionlint, rustfmt. The hooks that duplicate a job of their own
  # (svelte-check, bun test, zizmor) are skipped here rather than run twice.
  lint:
    name: lint (prek)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt
      - uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        env:
          SKIP: svelte-check,bun-test,zizmor
        with:
          # Pinned for the same reason zizmor is: a new release can add checks.
          prek-version: "0.3.5"

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # kerf-app's tauri-build embeds the frontend at compile time, so it must exist.
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Clippy (no ffmpeg dev libs)
        run: cargo clippy --workspace --all-targets --no-default-features --locked -- -D warnings

  msrv:
    # No `${{ env.MSRV }}` here: the `env` context is not available in a job
    # `name`, and referencing it makes the whole workflow fail to start.
    name: msrv
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      # Keep in sync with `rust-version` in the workspace Cargo.toml and the
      # badge in README.md — this job is what makes that claim true.
      MSRV: "1.95"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.MSRV }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: msrv-${{ env.MSRV }}
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Check on the minimum supported Rust version
        run: cargo check --workspace --all-targets --no-default-features --locked

  frontend:
    name: frontend check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Type check (svelte-check)
        working-directory: frontend
        run: bun run check
      # The TS mirrors of the Rust maths (beat grid, diff headline, delivery
      # formats) and the playback frame gate — the pieces that silently diverge
      # from kerf-core if nobody looks.
      - name: Unit tests (bun)
        working-directory: frontend
        run: bun run test
      # A broken production build only shows up at release time otherwise: the
      # `check` above type-checks, it does not bundle.
      - name: Build
        working-directory: frontend
        run: bun run build

  # The `#[ignore]`d tests: they synthesize media with lavfi and run the real
  # binary, so they check that the filter graphs ffmpeg is actually handed
  # *run* — playback streaming, a timeline with a still/crossfade/grade/
  # drawtext on it, and the cover-fit and project-frame export geometry. The
  # unit tests in `build` can only assert on argv. `downloads_a_real_model`
  # stays out: it pulls a whisper model over the network.
  #
  # Two kinds of FFmpeg. `system` is the distro package (6.1 on ubuntu-latest) —
  # the oldest thing a Linux user is likely to point Kerf at. `pinned` is the
  # exact build `scripts/fetch-ffmpeg.mjs` resolves for that OS — 9.0, what the
  # Windows installer ships, and the only place the FFmpeg 8+ code paths (the
  # `-/filter_complex` graph spill) run at all. On Windows it is also where the
  # path quoting and the 32767-char command line finally get exercised. A dead
  # pin fails the fetch, so this doubles as the pruned-autobuild early warning
  # (see the `schedule` trigger).
  engine:
    name: engine (${{ matrix.ffmpeg }} ffmpeg, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ffmpeg: system
          - os: ubuntu-latest
            ffmpeg: pinned
            triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            ffmpeg: pinned
            triple: x86_64-pc-windows-msvc
          # evermeet ships x86_64 only — the macOS release bundles are the
          # user's own ffmpeg, but this pins the same build the script offers.
          - os: macos-15-intel
            ffmpeg: pinned
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    # A green run takes 1-5 minutes; anything near this is a hang, not a slow test.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install FFmpeg (distro)
        if: matrix.ffmpeg == 'system'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          echo "KERF_FFMPEG=ffmpeg" >> "$GITHUB_ENV"
          echo "KERF_FFPROBE=ffprobe" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.ffmpeg == 'pinned'
      # The runner's default shell, not bash: on Windows, Git Bash puts GNU tar
      # first on PATH, which reads `C:\...` as a remote host; pwsh finds the
      # system bsdtar the script (and the release build) expects.
      - name: Fetch FFmpeg (pinned)
        if: matrix.ffmpeg == 'pinned'
        run: bun scripts/fetch-ffmpeg.mjs ${{ matrix.triple }}
      - name: Use the pinned FFmpeg
        if: matrix.ffmpeg == 'pinned'
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        # The path comes from the matrix, never from the event payload.
        run: | # zizmor: ignore[github-env]
          set -euo pipefail
          ext=""; [[ "$TRIPLE" == *windows* ]] && ext=".exe"
          # `pwd -W` is Git Bash's native `D:/...` form; a `/d/...` path means
          # nothing to the Windows process the tests spawn.
          bin="$(pwd -W 2>/dev/null || pwd)/crates/kerf-app/binaries"
          echo "KERF_FFMPEG=$bin/ffmpeg-$TRIPLE$ext" >> "$GITHUB_ENV"
          echo "KERF_FFPROBE=$bin/ffprobe-$TRIPLE$ext" >> "$GITHUB_ENV"
      - name: FFmpeg version
        shell: bash
        run: '"$KERF_FFMPEG" -hide_banner -version | head -1'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: engine-${{ matrix.os }}
      - name: Run the ffmpeg-binary tests
        shell: bash
        run: |
          cargo test -p kerf-core --no-default-features --locked -- \
            --ignored --skip downloads_a_real_model

  # The GPU compositor against FFmpeg. `kerf-gpu`'s parity harness renders the
  # same timelines at the same times through FFmpeg's own still and through the
  # wgpu compositor and holds them to a PSNR / max-error threshold (see
  # `crates/kerf-gpu/tests/parity.rs`). A runner has no GPU, so wgpu runs on
  # Mesa's lavapipe software Vulkan driver — which is also what makes the
  # thresholds reproducible rather than a property of someone's graphics card.
  # The harness synthesizes its own media. It runs against the distro FFmpeg
  # **and** the pinned one the release bundles ship: the two disagree about
  # colour (FFmpeg 9 negotiates the composite's matrix across the overlay chain,
  # FFmpeg 6 does not — the compositor probes which it is dealing with), so a
  # parity that held for one build is not evidence about the other. The benchmark
  # in the same crate skips itself unless `KERF_BENCH` is set.
  parity:
    name: gpu parity (${{ matrix.ffmpeg }} ffmpeg, lavapipe)
    strategy:
      fail-fast: false
      matrix:
        include:
          - ffmpeg: system
          - ffmpeg: pinned
            triple: x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KERF_HWACCEL: none
      KERF_HW_ENCODE: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install a software Vulkan driver
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
      - name: Install FFmpeg (distro)
        if: matrix.ffmpeg == 'system'
        run: |
          sudo apt-get install -y ffmpeg
          echo "KERF_FFMPEG=ffmpeg" >> "$GITHUB_ENV"
          echo "KERF_FFPROBE=ffprobe" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: matrix.ffmpeg == 'pinned'
      - name: Fetch FFmpeg (pinned)
        if: matrix.ffmpeg == 'pinned'
        run: bun scripts/fetch-ffmpeg.mjs ${{ matrix.triple }}
      - name: Use the pinned FFmpeg
        if: matrix.ffmpeg == 'pinned'
        shell: bash
        env:
          TRIPLE: ${{ matrix.triple }}
        # The path comes from the matrix, never from the event payload.
        run: | # zizmor: ignore[github-env]
          set -euo pipefail
          bin="$(pwd)/crates/kerf-app/binaries"
          echo "KERF_FFMPEG=$bin/ffmpeg-$TRIPLE" >> "$GITHUB_ENV"
          echo "KERF_FFPROBE=$bin/ffprobe-$TRIPLE" >> "$GITHUB_ENV"
      - name: FFmpeg version
        run: '"$KERF_FFMPEG" -hide_banner -version | head -1'
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: parity-${{ matrix.ffmpeg }}
      - name: Run the parity harness
        run: cargo test -p kerf-gpu --no-default-features --locked -- --ignored
      # A failing case leaves its reference / GPU / diff images behind.
      - name: Keep the images of a failed comparison
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parity-images-${{ matrix.ffmpeg }}
          path: target/parity/
          if-no-files-found: ignore
          retention-days: 7

  # Every other job builds `--no-default-features`, so the in-process libav
  # backend (`engine/ffmpeg.rs`, and the experimental `libav-render` pipeline)
  # only ever compiled on a machine that happened to have the dev libraries.
  libav:
    name: libav backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install FFmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang libclang-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check with the ffmpeg + libav-render features
        run: cargo check -p kerf-core --all-targets --features ffmpeg,libav-render --locked

  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies (Tauri)
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: build-${{ matrix.platform }}
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      # Compile the whole workspace on every OS without the FFmpeg dev libraries
      # (the CLI engine still drives the ffmpeg/ffprobe binaries). The desktop
      # app embeds the MCP server, so there is no separate binary to build.
      - name: Build workspace
        run: cargo build --workspace --no-default-features --locked
      # Unit + integration + doc tests for every crate. They used to be a job
      # of their own, but kerf-app needs exactly the toolchain + built frontend
      # this job already has, and a separate job per OS was mostly time spent
      # queueing for a runner — macOS ones above all.
      - name: Run tests
        run: cargo test --workspace --no-default-features --locked

  # Release bundles are built with `--features whisper` (in-process speech-to-text,
  # so transcription doesn't depend on how the user's ffmpeg was configured). Every
  # job above builds `--no-default-features`, so nothing else here compiles
  # whisper-rs — without this job, a break in it, or a runner image that dropped
  # cmake/libclang, would surface for the first time during a release.
  #
  # On a pull request `pr-build.yml` already compiles whisper into the Linux x64,
  # Windows and macOS arm64 bundles, so only the arm64 Linux runner it has no
  # bundle for runs here. Everywhere the bundles skip — Dependabot, drafts — and
  # on main (which also covers the x86_64 macOS cross-compile) it is all four.
  whisper:
    name: whisper feature (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON((github.event_name != 'pull_request' || github.actor == 'dependabot[bot]' || github.event.pull_request.draft) && '["ubuntu-22.04", "ubuntu-22.04-arm", "macos-latest", "windows-latest"]' || '["ubuntu-22.04-arm"]') }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    env:
      # What `tauri build` passes on macOS, from `bundle.macOS.minimumSystemVersion`
      # in tauri.conf.json — keep the two in step. Without it this job compiles
      # against the runner's SDK default and misses what the release hits:
      # ggml uses std::filesystem, which libc++ marks unavailable before 10.15.
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/whisper-toolchain
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: whisper-${{ matrix.platform }}
      # kerf-core is where whisper-rs is actually used; kerf-app only forwards the
      # feature, and checking it would drag in the Tauri toolchain and a built
      # frontend for no extra coverage.
      - name: Check with in-process whisper
        run: cargo check -p kerf-core --no-default-features --features whisper --locked
      # The release builds a second macOS bundle for x86_64 on the arm64 runner —
      # a cross-compile of whisper.cpp, which is the part most likely to break.
      - name: Check the cross-compiled macOS target
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          cargo check -p kerf-core --no-default-features --features whisper --locked \
            --target x86_64-apple-darwin

  # One status that is green only when every job above is — a single required
  # check for the ruleset instead of a list that has to track the matrix.
  ci-ok:
    name: ci ok
    if: always()
    needs: [lint, clippy, msrv, frontend, engine, parity, libav, build, whisper]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
