name: Prepare release

# Opens the release PR: bumps the version in every file `version-check` in
# release.yml compares against the tag, and re-pins the bundled FFmpeg to the
# newest upstream build (BtbN prunes autobuilds after about two weeks, so a pin
# left alone since the last release may already be gone). Merge the PR, then
# publish a GitHub release tagged `v<version>` on the merge commit.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.23.0)"
        required: true
        type: string

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: open the release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # A push made with GITHUB_TOKEN triggers no workflows, so CI is
      # dispatched onto the branch explicitly — its checks land on the PR head.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Bump the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::'$VERSION' is not a semver version (no leading v)"; exit 1; }
          sed -i '/^\[workspace.package\]/,/^\[/ s/^version = ".*"/version = "'"$VERSION"'"/' Cargo.toml
          sed -i '0,/"version": ".*"/ s//"version": "'"$VERSION"'"/' frontend/package.json crates/kerf-app/tauri.conf.json
          # Only the workspace members' own entries move; no dependency is touched.
          cargo update --workspace
          git diff --stat
      - name: Re-pin the bundled FFmpeg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/fetch-ffmpeg.mjs --repin | tee repin.txt
      - name: Commit, push and open the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          branch="release/$VERSION"
          pin=$(tail -1 repin.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Cargo.toml Cargo.lock frontend/package.json crates/kerf-app/tauri.conf.json scripts/fetch-ffmpeg.mjs
          git commit -m "release $VERSION" -m "Re-pins the bundled FFmpeg: $pin."
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/$branch"
          gh workflow run ci.yml --ref "$branch"
          # Opening the PR needs "Allow GitHub Actions to create and approve pull
          # requests" (Settings › Actions › General). Without it the branch is
          # still pushed and CI still runs; open the PR from the link.
          gh pr create --base main --head "$branch" --title "release $VERSION" \
            --body "Bumps the version to $VERSION and re-pins the bundled FFmpeg ($pin). After merging, publish a release tagged \`v$VERSION\` on the merge commit." \
            || echo "::warning::could not open the PR — https://github.com/$GH_REPO/compare/main...$branch?expand=1"
