name: PR build

# Installers for every pull request, so a change can be tried as the app it
# becomes rather than only read: the author (or a reviewer) downloads the build
# for their OS from the comment `pr-build-comment.yml` leaves on the PR.
#
# Built like `release.yml`'s bundles — same frontend step, same bundled FFmpeg on
# Windows, same `--features whisper` — minus everything that makes a release
# trustworthy: no minisign signature, no updater artifacts, no attestation, and
# the cargo cache is used. These are throwaway test builds of unreviewed code.
#
# This runs on `pull_request`, never `pull_request_target`: a fork's code builds
# with a read-only token and no secrets. Commenting needs a write token, which a
# fork's run never gets, so that half lives in `pr-build-comment.yml`.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Builds on main exist to warm the cargo cache: a PR can restore its base
  # branch's cache but never another PR's, so without these every new PR would
  # compile its release build from nothing.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # A test build, not a release: skip the workspace's thin LTO, which costs
  # minutes of linking for a speedup nobody trying a PR will notice.
  CARGO_PROFILE_RELEASE_LTO: "false"

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    # Dependency bumps get no installers: nobody tries a lockfile change by hand,
    # and four bundle builds per Dependabot PR is most of a day of runner time.
    if: ${{ github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && !github.event.pull_request.draft) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            config: '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false,"externalBin":["binaries/ffmpeg","binaries/ffprobe"],"resources":["licenses/whisper.cpp-NOTICE.md","licenses/FFmpeg-NOTICE.md","licenses/FFmpeg-LICENSE.txt"]}}'
            bundleFfmpeg: true
            # NSIS only: the .msi is the same app through a slower WiX build.
            bundles: nsis
            files: target/release/bundle/nsis/*.exe
          - name: macos-arm64
            platform: macos-latest
            config: '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'
            bundles: dmg
            files: target/release/bundle/dmg/*.dmg
          - name: linux-x64
            platform: ubuntu-22.04
            config: '{"build":{"beforeBuildCommand":""},"bundle":{"createUpdaterArtifacts":false}}'
            bundles: appimage,deb
            files: |
              target/release/bundle/appimage/*.AppImage
              target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.platform }}
    env:
      # What `tauri build` passes on macOS; see the `whisper` job in ci.yml.
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Linux dependencies (Tauri)
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: pr-bundle-${{ matrix.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Fetch bundled FFmpeg
        if: matrix.bundleFfmpeg
        run: bun scripts/fetch-ffmpeg.mjs x86_64-pc-windows-msvc
      - name: Install the whisper.cpp build toolchain
        uses: ./.github/actions/whisper-toolchain
      - name: Build bundles
        working-directory: crates/kerf-app
        env:
          CONFIG: ${{ matrix.config }}
          BUNDLES: ${{ matrix.bundles }}
        shell: bash
        run: bunx @tauri-apps/cli@2 build --bundles "$BUNDLES" --config "$CONFIG" -- --no-default-features --features whisper --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kerf-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  # The PR number for `pr-build-comment.yml`. A `workflow_run` event lists no
  # pull requests for a fork's run, so the number travels as an artifact — which
  # the commenter treats as untrusted and checks against the commit it built.
  pr-number:
    name: pr number
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record the PR number
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir pr
          echo "$PR" > pr/number
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-number
          path: pr/number
          retention-days: 1
