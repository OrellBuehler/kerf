name: Image

# Builds the hosted MCP server image (deploy/Dockerfile) and smoke-tests it: no token → 401,
# initialize → 200, a tool call. Only when something the image is made of changes; nothing is
# pushed to a registry (see the note at the end of release.yml).
on:
  # Pull requests pay for the ~40-minute build only when the image itself changes; a change to
  # the app reaches it on main, where a break shows up right after the merge.
  pull_request:
    paths:
      - "deploy/**"
      - ".dockerignore"
      - "scripts/fetch-ffmpeg.mjs"
      - ".github/workflows/image.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".dockerignore"
      - "scripts/fetch-ffmpeg.mjs"
      - ".github/workflows/image.yml"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: hosted image (build + smoke test)
    runs-on: ubuntu-24.04
    # A cold build compiles the whole workspace in release with whisper.cpp; ~30-40 minutes.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          push: false
          tags: kerf-mcp:ci
          cache-from: type=gha,scope=kerf-mcp
          # Saved from main only, like the cargo caches in ci.yml.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=kerf-mcp,mode=max' || '' }}
      - name: Smoke test
        run: deploy/smoke-test.sh kerf-mcp:ci
