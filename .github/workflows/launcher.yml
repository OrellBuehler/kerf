name: Launcher

# The npm launcher (npm/kerf-mcp): its pins and key match the repo's, and on every platform it
# downloads the latest release, checks its signature, unpacks it and answers MCP over stdio.
on:
  pull_request:
    paths:
      - "npm/kerf-mcp/**"
      - "scripts/fetch-ffmpeg.mjs"
      - "crates/kerf-app/tauri.conf.json"
      - ".github/workflows/launcher.yml"
  push:
    branches: [main]
    paths:
      - "npm/kerf-mcp/**"
      - "scripts/fetch-ffmpeg.mjs"
      - "crates/kerf-app/tauri.conf.json"
      - ".github/workflows/launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  in-sync:
    name: pins, key and version match the repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: ffmpeg-pins.json is what fetch-ffmpeg.mjs pins
        run: bun scripts/fetch-ffmpeg.mjs --pins | diff - npm/kerf-mcp/ffmpeg-pins.json
      - name: The launcher verifies with the updater's key, and carries the app's version
        run: |
          python3 - <<'PY'
          import base64, json, re, sys
          conf = json.load(open("crates/kerf-app/tauri.conf.json"))
          key = base64.b64decode(conf["plugins"]["updater"]["pubkey"]).decode().strip().splitlines()[-1]
          src = open("npm/kerf-mcp/bin/kerf-mcp.mjs").read()
          got = re.search(r'const PUBKEY = "([^"]+)"', src).group(1)
          pkg = json.load(open("npm/kerf-mcp/package.json"))["version"]
          ok = True
          if got != key:
              print(f"::error::the launcher's PUBKEY is not tauri.conf.json's updater key"); ok = False
          if pkg != conf["version"]:
              print(f"::error::npm/kerf-mcp is {pkg}, the app is {conf['version']}"); ok = False
          sys.exit(0 if ok else 1)
          PY

  run:
    name: run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # The package's own version may be a release that is not published yet (a release PR).
      - name: Pick the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release view --json tagName --jq .tagName)
          echo "KERF_VERSION=${tag#v}" >> "$GITHUB_ENV"
      - name: The libraries a desktop Linux has
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libgtk-3-0 libgl1 libegl1 libgbm1 libx11-xcb1
      # No FFmpeg build is pinned for arm64, so there the launcher asks for one to be installed.
      - name: FFmpeg, where the launcher fetches none
        if: runner.arch == 'ARM64'
        shell: bash
        run: |
          if command -v ffmpeg > /dev/null; then exit 0; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get install -y -qq --no-install-recommends ffmpeg; fi
      - name: Download, verify and unpack
        run: node npm/kerf-mcp/bin/kerf-mcp.mjs install
      - name: Speak MCP to it
        run: node npm/kerf-mcp/test/handshake.mjs
